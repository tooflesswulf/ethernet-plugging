# Friction compensation constants for impedance.friction_feedforward.
#
# Edit THIS file, not impedance.py. If the file is missing or malformed the
# controller falls back to NO compensation (all zeros), which is the safe
# direction -- it is also what env.py has been running.

[provenance]
measured = "2026-09-21"
tool = "test-breakaway.py --joints 1,2,3 --reps 3, all friction scales at zero"
data = [
    "breakaway-20260919-171811.npz",
    "breakaway-20260921-141908.npz",   # all six joints, from here on
    "breakaway-20260921-143122.npz",
    "breakaway-20260921-144105.npz",
    "breakaway-20260921-144959.npz",
    "breakaway-20260921-151040.npz",
    "breakaway-20260921-113338.npz",
    "breakaway-20260921-113810.npz",
    "breakaway-20260921-114321.npz",
    "breakaway-20260921-114759.npz",
]
asymmetry = """
The +/- difference g = (|tau-| - |tau+|)/2 is TWO things, and 45 measurements
over ten poses separate them:

    g = gravity_residual(q) + per-joint friction asymmetry     R^2 0.889

  gravity alone            R^2 0.727   (4 params)
  per-joint constant alone R^2 0.551   (6 params)

  joint   friction asym   gravity term range   dominates
    0        +1.04         +0.00 to  +0.00     constant  (zero gravity load)
    1        +1.64         -1.63 to  +5.60     GRAVITY
    2        -0.32         -2.33 to  +2.85     GRAVITY
    3        +0.49         -0.30 to  +0.33     constant
    4        +1.02         -0.16 to  +0.25     constant
    5        +0.54         -0.69 to  +0.22     constant

Joint 0 is the control: its axis is vertical so it carries zero gravity torque
at every pose, and it still shows +1.04 Nm of asymmetry. That cannot be gravity.
"""
note = """
f_c is the MINIMUM measured breakaway across all five poses, per joint per
direction -- not the mean. Breakaway varies with load (joint 1 spans 6.83-8.94
Nm positive and 11.03-21.98 negative across these poses) and over-compensation
is a runaway rather than a limit cycle, because the term pushes ALONG the
velocity a joint already has. The minimum keeps the standstill term under the
weakest pose everywhere inside the measured envelope.
"""

[scales]
# FIRMWARE friction compensation scales, per joint 0..5, passed to
# direct_torque by the patched control script. These are the operating values:
# env.py, brr.py and the measurement scripts should all read them from here
# rather than keeping their own copies, which is how the repo ended up with two
# disagreeing coulomb tables (test-friction-recal's [0.8, 0.8, 0.7, 0.8, 0.8,
# 0.8] and brr.py's [0.9, 0.8, 0.8, 0.7, 0.8, 1.0]).
#
# Measured per joint at TWO poses each, 2026-09-21 (scale-sweep-2026092*.npz),
# 0.0-1.0 in steps of 0.2. The over-compensation threshold -- where the joint
# ACCELERATES after breakaway instead of stopping -- is:
#
#   joint 0   1.00     joint 2   > 1.00     joint 4   > 1.00
#   joint 1   0.80     joint 3   > 1.00     joint 5   > 1.00
#
# JOINT 1 IS THE ODD ONE OUT and it is consistent: 0.80 at both poses here and
# at the 2026-09-19 pose, three for three. Every other joint was still stable at
# the top of the sweep. That is why these are per joint and not one global
# number -- a single 0.8 would have driven joint 1 while under-using the rest.
#
# Set one step below each threshold. Joints 2-5 are set to 0.8 rather than 1.0
# because the sweep stopped at 1.0 and never found their limit, so the margin
# there is unknown rather than large.
#
# The verdicts behind these are inertia-independent -- a pure comparison of
# velocity before and after the torque is removed -- so unlike f_k below they
# do not inherit the URDF inertia's errors.
coulomb = [0.8, 0.6, 0.8, 0.8, 0.8, 0.8]

# VISCOUS is inherited, NOT measured. It has never been swept on any joint.
# Viscous compensation cancels damping, and damping is what turns a constant
# over-compensation excess into a terminal velocity instead of acceleration --
# so a viscous scale that is too high removes the thing that would otherwise
# bound a coulomb runaway. test-scale-sweep.py --axis viscous measures it.
viscous = [0.9, 0.9, 0.8, 0.9, 0.9, 0.9]

[gravity_residual]
# The controller's own gravity compensation is wrong by a standing torque that
# varies with pose. Modelled as a phantom point mass rigidly attached to the
# tool, parameterised by its mass-moment so the model is LINEAR in theta:
#
#   g_j(q) = 9.81 * [ J_v[:,j] . g_hat , (R^T (g_hat x J_w[:,j])) ] . theta
#   theta  = [ dm , dm*p_x , dm*p_y , dm*p_z ]        kg, kg m
#
# Fitted jointly with a per-joint friction asymmetry over 45 measurements
# (6 joints x up to 10 poses, breakaway-*.npz). Splitting the two matters: the
# combined model reaches R^2 0.889, against 0.727 for gravity alone and 0.551
# for per-joint constants alone. Joint 0 is the control -- vertical axis, zero
# gravity torque at every pose, and still +1.04 Nm of asymmetry, so the
# constant part is real and is not gravity leaking through.
#
# Residual after the fit: 0.1-0.35 Nm on joints 0/3/4/5, ~1.0 Nm on 1 and 2.
theta = [-0.752842, 0.073373, 0.013608, 0.087259]

# Per-joint friction asymmetry left over once the gravity term is removed [Nm].
# NOT used by the control path -- recorded because it is what f_c+ and f_c-
# should straddle once tau_bias is live, and because joint 0's entry is the
# evidence that friction asymmetry exists at all.
asymmetry = [1.035, 1.641, -0.317, 0.490, 1.015, 0.541]

# f_c minima recomputed from GRAVITY-CORRECTED breakaway, i.e. what f_c_pos /
# f_c_neg below should become once tau_bias is actually supplied. Do not swap
# these in before then -- without the bias they would over-compensate joint 1
# by up to 2.7 Nm.
# They are the f_c_pos_bias / f_c_neg_bias keys below -- real keys, not
# commented out, so they can be A/B'd (test-teleop.py --corrected-fc) without
# editing this file. Nothing reads them by default.
# Cancelling the gravity term cuts joint 1's across-pose spread from 2.97x to
# 2.00x and lifts its negative minimum 8.88 -> 10.40. The other joints barely
# move, which is the same conclusion the per-joint fit reached.

[friction]
# Positive- and negative-direction breakaway [Nm], per joint 0..5.
# All six joints measured as of 2026-09-21. Do NOT reinstate the pre-2026-09-21
# table -- it was taken at coulomb 0.8, past the over-compensation threshold,
# with a single-sample detector that over-read by whatever travel the velocity
# took to build.
#
# Joint 0 is worth noting: it carries ZERO gravity torque at every pose, so its
# 1.21x asymmetry cannot be a standing gravity torque. That is the cleanest
# evidence so far that genuine friction asymmetry exists and is not just the
# gravity residual showing through.
# True minima now: joints 1-3 over TEN poses, joints 0/4/5 over FIVE. The
# provisional 0.8 haircut those three carried is gone -- they have real minima.
# Rounded down.
#
# Joint 1's negative minimum dropped 11.03 -> 8.88 when the new poses arrived,
# which is the minimum rule doing its job: five poses had not yet found the
# weak one. Expect it to keep falling slowly as poses are added.
# Valid ONLY with tau_bias live -- see [gravity_residual]. Without the bias
# these over-compensate joint 1 by up to 2.7 Nm.
f_c_pos_bias = [9.31, 9.00, 3.94, 1.41, 1.90, 1.41]
f_c_neg_bias = [11.03, 10.40, 6.32, 2.54, 4.25, 2.36]

f_c_pos = [9.30, 6.32, 4.09, 1.56, 1.95, 1.94]
f_c_neg = [11.02, 8.87, 6.15, 2.43, 4.11, 2.58]

# KINETIC friction [Nm] left over at the coulomb scales above -- the torque
# that still opposes motion once the firmware has done its half. Measured from
# the coast deceleration, I*(qd0^2 - qd_end^2)/(2*travel), minimum across the
# two poses per joint (same conservative rule as f_c: under-compensating is
# safe, over-compensating drives the joint).
#
# HOW MUCH TO TRUST THESE: they scale directly with the joint inertia, which
# comes from the URDF via crba. Chirp identification already found that model
# wrong by 1.5-4.2x on five axes (see impedance.py), and for geared joints the
# reflected rotor inertia usually dominates the link inertia and is usually
# absent from a URDF altogether. The inertias used were
#
#   j0 2.656   j1 3.350   j2 1.045   j3 0.047   j4 0.008   j5 0.001  kg m^2
#
# so joints 0-2 are link-dominated and plausible, while 3-5 are small enough
# that a missing rotor term would swamp them. Joints 4 and 5 reading 0.00 means
# "below what this method can resolve", NOT "no kinetic friction". Zero is the
# safe value either way, so they stay zero until there is a better inertia.
f_k_pos = [0.48, 0.31, 0.22, 0.02, 0.0, 0.0]
f_k_neg = [0.56, 1.64, 1.17, 0.04, 0.0, 0.0]

# Weight on the STANDSTILL term only: the term is f_c * assist * tanh(tau/t_eps),
# so the delivered push at rest is assist * f_c. At 0.8 that is 80% of the
# weakest measured breakaway, which is the intended doctrine.
#
# It does NOT weight the kinetic term -- that has its own magnitude, f_k above.
fc_assist = 0.8

# How sharply the term flips with velocity sign. Too small and it is effectively
# f_c*sign(qd), so every reversal swings the torque by 2*f_c, which chatters.
fc_veps = 0.05
# Commanded-torque scale for the standstill term's tanh.
fc_teps = 4.0
