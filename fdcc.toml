# FDCC-style Cartesian admittance over speedL, UR16e.
# Only keys read by fdcc.py / env.py. The algorithm, and the measurements behind
# these numbers, are in FDCC-ADMITTANCE.md (§11 for the measured facts).
# Units SI, angles in radians. [trans, rot] pairs are [m-based, rad-based].

[robot]
rate_hz = 500                           # control loop; dt = 0.002 s
tcp_offset = [0.0, 0.0, 0.1537, 0.0, 0.0, 0.0]   # compared with getTCPOffset() at startup
payload_kg = 1.551                      # compared with getPayload() at startup
payload_tolerance_kg = 0.02             # an unsaved pendant edit once left 1.67 kg for a week
tcp_tolerance_m = 0.001

[wrench]
# getActualTCPForce: base-frame axes, moment taken about the FLANGE (measured
# with the spin-ratio test; UR's docs say TCP). Sign +1 = force ON the tool.
reference_point = "flange"
sign = 1.0
lowpass_hz = 30.0                       # first order. 2nd-order at 10-12 Hz cut 25 Hz but its lag made contact worse
deadband = [1.5, 0.4]                  # soft deadband on |F| [N], |tau| [Nm]; F/T error is ~1.8 N median
clamp = [25.0, 2.0]                     # input clamp [N, Nm]. Hand pushes reach ~39 N and feel "saturated" here

[admittance]
frame = "tool"                          # K, D, M, selection act on TCP axes ("base" = fixed axes)
compliance_point = [0.0, 0.0, 0.0]      # in TCP frame [m]
stiffness = [300.0, 10.0]               # K  [N/m, Nm/rad]
damping = [1000.0, 20.0]                # D  [N s/m, Nm s/rad]; 1/D = 1 mm/s per N free-space
mass = [15.0, 0.6]                      # M  [kg, kg m^2]. 10 kg / 0.3 kg m^2 rang at 25 Hz (md §8, §11)
selection = [1, 1, 1, 1, 1, 1]          # 1 compliant, 0 stiff (position tracking)
stiff_gain = 5.0                        # [1/s] on stiff axes: v = v_t - stiff_gain * e

[feedforward]
# D * v_t is a force in disguise; fade it when the environment resists the motion.
release = [3.0, 0.8]                    # resisting [N, Nm] at which the feedforward is fully off
recover_s = 0.3                         # drops instantly, recovers 0 -> 1 over this long (symmetric fade rang at 25 Hz)
filter_hz = 5.0                         # low-pass on the force the fade reads; the ~28 Hz wobble after an impact kept it tripped

[limits]
speed = [0.08, 0.9]                     # norm clamp on commanded twist [m/s, rad/s]
accel = [2.0, 4.0]                      # norm clamp on change of commanded twist [m/s^2, rad/s^2]; also speedL's acceleration argument
abort_wrench = [inf, inf]               # halt above |F| [N], |tau| [Nm] (raw getActualTCPForce). inf (or 0) = no limit; tested value was [45.0, 5.0]

[scripted]
# env.set_gains() during scripted MotionSteps (interrupt_sequence.py), restored after.
# At the default K the last mm crawl in with D/K = 3.3 s (2 s rotation) against
# MotionStep's 2 mm / 0.02 rad tolerance. These give 0.33 s / 0.2 s, damping ratio ~2.4 / 1.3.
stiffness = [3000.0, 100.0]             # K [N/m, Nm/rad]; D and M unchanged

[zforce]
# Adaptive z-force mode (DualSense Triangle): the target z integrates the force error,
#   dz_t/dt = gain * (F_z - F_z,des), capped at max_speed.
# In contact the force settles with tau = 1 / (K_z * gain) (0.33 s at K 300); in free
# space the target descends at max_speed, which sets the impact force (~1 N per mm/s).
gain = 0.01                             # [m / (N s)]
max_speed = 0.01                        # [m/s]

[rtde]
speedl_time_cycles = 1                  # time argument = 1 cycle. 4 cycles (8 ms) -> 125 Hz buzz on speed changes
watchdog_hz = 20.0                      # setWatchdog: host silence > 50 ms -> protective stop C207A0
stop_decel = 1.0                        # speedStop(a) -- only ever called once the arm is already at rest
ramp_down_timeout_s = 0.5
rest_speed = [0.0005, 0.005]            # "at rest" for ramp-down [m/s, rad/s]

[teleop]
leash = [0.03, 0.25]                    # env diagnostics: % of cycles the target is further than this from the arm [m, rad]
